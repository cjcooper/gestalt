[package]
name = "gestalt"
version = "0.1.0"
description = "Desktop runner for OpenTofu across a folder tree"
authors = ["Chris Cooper"]
edition = "2024"

[lib]
# The `_lib` suffix is needed so the lib name doesn't clash with the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "gestalt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
hcl-rs = "0.20.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
