[package]
name = "gestalt"
version = "0.1.2"
description = "Desktop runner for OpenTofu across a folder tree"
authors = ["Chris Cooper"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix is needed so the lib name doesn't clash with the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "gestalt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
hcl-rs = "0.20.0"
notify-debouncer-full = "0.7.0"
tauri-plugin-opener = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Reading the macOS accent / highlight colours (system_colors.rs). Same
# versions Tauri already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSOperation", "NSString", "NSUserDefaults"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSAccessibility", "NSAppearance", "NSColor", "NSColorSpace", "NSWorkspace"] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
# Mock runtime (tauri::test) for exercising commands that take AppHandle/State.
tauri = { version = "2", features = ["test"] }
