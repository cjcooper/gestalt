<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestalt</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <header class="toolbar">
      <button id="open-root" class="primary with-icon" title="Open folder (⌘O)">
        <span class="icon" data-icon="folderPlus"></span>Open folder…
      </button>
      <button id="refresh-tree" class="with-icon" title="Refresh files and commits (⌘R)" disabled>
        <span class="icon" data-icon="refresh"></span>Refresh
      </button>
      <span id="root-path" class="muted">No folder open</span>
      <span class="spacer"></span>
      <span id="env-status" class="muted"></span>
      <button id="env-reload">Reload env</button>
      <span id="tofu-version" class="muted"></span>
    </header>

    <main id="welcome" class="welcome" hidden>
      <div class="welcome-card">
        <span class="welcome-icon" data-icon="folderOpen"></span>
        <h1>Open an infrastructure folder</h1>
        <p class="muted">
          Pick the root of your OpenTofu repo. Right-click any folder in the tree to plan or apply it.
        </p>
        <button id="welcome-open" class="primary big with-icon">
          <span class="icon" data-icon="folderPlus"></span>Open folder…
        </button>
        <p class="muted shortcut">or press ⌘O</p>
        <p id="welcome-error" class="error" hidden></p>
      </div>
    </main>

    <div id="workspace" class="layout" hidden>
      <nav class="sidebar" id="sidebar">
        <div class="side-tabs" role="tablist">
          <button role="tab" data-tab="commits">Commits</button>
          <button role="tab" data-tab="files">Files</button>
        </div>
        <div class="side-panel" data-panel="files" role="tabpanel">
          <ul id="tree" class="tree" role="tree"></ul>
        </div>
        <div class="side-panel" data-panel="commits" role="tabpanel" hidden>
          <div class="commits-branch" id="commits-branch"></div>
          <p class="commits-status muted" id="commits-status" hidden></p>
          <ul class="commit-list" id="commit-list"></ul>
          <button id="commits-more" class="load-more" hidden>Load more</button>
        </div>
      </nav>
      <div
        class="splitter"
        id="splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize side pane"
        tabindex="0"
        title="Drag to resize · double-click to reset"
      ></div>

      <section class="runs">
        <div class="run-tabs" id="run-tabs"></div>
        <div class="run-header" id="run-header" hidden>
          <span id="run-title"></span>
          <span id="run-status" class="status"></span>
          <span class="spacer"></span>
          <button id="run-apply" class="primary">Apply this plan…</button>
          <button id="run-cancel">Cancel</button>
        </div>
        <pre id="run-output" class="output"></pre>
      </section>
    </div>
  </body>
</html>
