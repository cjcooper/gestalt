# cargo-about: which licenses Gestalt's Rust dependencies may use.
# Used by scripts/licenses.mjs to build the About window and THIRD_PARTY_NOTICES.md.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
]
# Every platform Gestalt may ship on, so the inventory is the same whichever
# OS generates it.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
# Ship-only: dev-dependencies and build tools aren't distributed.
ignore-build-dependencies = true
ignore-dev-dependencies = true
